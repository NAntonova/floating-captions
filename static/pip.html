<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captions Overlay</title>
    <style>
        :root {
            --caption-font-size: 24px;
            --text-primary: #f2efeb;
            --text-secondary: #bab6ae;
            --accent: #f7ede0;
            --primary: #d6c3ac;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent !important;
            margin: 0 !important;
            padding: 0 !important;
            height: 100vh !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex !important;
            flex-direction: column !important;
        }

        /* macOS Spotlight / Apple Accessibility inspired glassmorphic container */
        .pip-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(26, 25, 23, 0.75); /* Warm translucent dark surface */
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08); /* White sub-border */
            border-radius: 18px; /* Native rounded corners */
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            padding: 1.25rem;
            position: relative;
            transition: background 0.3s ease;
        }

        /* Hover-to-reveal close button in top-right */
        .close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.2s ease, background 0.2s ease;
            z-index: 10;
        }

        .pip-container:hover .close-btn {
            opacity: 0.6;
        }

        .close-btn:hover {
            opacity: 1.0 !important;
            background: rgba(224, 108, 103, 0.5); /* Soft red close highlight */
        }

        /* Hover-to-reveal controls in top-left */
        .font-controls {
            position: absolute;
            top: 12px;
            left: 14px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .pip-container:hover .font-controls {
            opacity: 0.6;
        }

        .font-controls:hover {
            opacity: 1.0 !important;
        }

        .font-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* Scrollable transcript area */
        .pip-transcript-box {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Keep scrolling text pinned to bottom */
            padding-right: 4px;
            scroll-behavior: smooth;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* Hide scrollbars */
        .pip-transcript-box::-webkit-scrollbar {
            display: none;
        }

        .pip-scroll-wrapper {
            display: inline;
            font-size: var(--caption-font-size, 24px);
            line-height: 1.5;
            font-weight: 400;
            letter-spacing: -0.01em;
            word-wrap: break-word;
        }

        .pip-text-final {
            color: var(--text-primary);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .pip-text-nonfinal {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.85;
            border-bottom: 1.5px dashed rgba(214, 195, 172, 0.3);
            text-shadow: none;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="pip-container">
        <!-- Overlay Settings (revealed on hover) -->
        <div class="font-controls">
            <button class="font-btn" onclick="adjustFont(-2)" title="Decrease font size">−</button>
            <button class="font-btn" onclick="adjustFont(2)" title="Increase font size">+</button>
            <button class="font-btn" onclick="toggleOpacity()" title="Cycle background opacity" id="opacity-btn">◑</button>
        </div>
        <button class="close-btn" onclick="closeWindow()" title="Close overlay">×</button>
        
        <!-- Captions transcript -->
        <div class="pip-transcript-box" id="scroll-container">
            <div class="pip-scroll-wrapper">
                <span class="pip-text-final" id="final-span"></span>
                <span class="pip-text-nonfinal" id="nonfinal-span"></span>
            </div>
        </div>
    </div>

    <script>
        function closeWindow() {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.closeHandler) {
                window.webkit.messageHandlers.closeHandler.postMessage("close");
            } else {
                window.close();
            }
        }

        let currentSize = 24; // default starting size
        let opacityPresets = [0.75, 0.9, 0.5, 0.3];
        let currentOpacityIndex = 0;

        function updateFontSize(size) {
            currentSize = parseInt(size, 10);
            if (currentSize < 14) currentSize = 14;
            if (currentSize > 72) currentSize = 72;
            document.documentElement.style.setProperty('--caption-font-size', `${currentSize}px`);
            localStorage.setItem('caption-font-size', currentSize);
        }

        function adjustFont(delta) {
            updateFontSize(currentSize + delta);
        }

        function updateOpacity(opacity) {
            const val = parseFloat(opacity);
            document.querySelector('.pip-container').style.background = `rgba(26, 25, 23, ${val})`;
            localStorage.setItem('caption-opacity', val);
            
            // Sync active index
            const index = opacityPresets.indexOf(val);
            if (index !== -1) {
                currentOpacityIndex = index;
            }
        }

        function toggleOpacity() {
            currentOpacityIndex = (currentOpacityIndex + 1) % opacityPresets.length;
            updateOpacity(opacityPresets[currentOpacityIndex]);
        }

        // Read saved size and opacity on startup
        const savedSize = localStorage.getItem('caption-font-size');
        if (savedSize) {
            updateFontSize(savedSize);
        }

        const savedOpacity = localStorage.getItem('caption-opacity');
        if (savedOpacity) {
            updateOpacity(savedOpacity);
        } else {
            updateOpacity(0.75); // initial default
        }

        // Listen for storage changes from the dashboard
        window.addEventListener('storage', (event) => {
            if (event.key === 'caption-font-size' && event.newValue) {
                updateFontSize(event.newValue);
            }
            if (event.key === 'caption-opacity' && event.newValue) {
                updateOpacity(event.newValue);
            }
        });

        const finalSpan = document.getElementById("final-span");
        const nonfinalSpan = document.getElementById("nonfinal-span");
        const scrollContainer = document.getElementById("scroll-container");

        function scrollToBottom() {
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/captions_ws`;
        
        let socket = null;
        
        function connectWebSocket() {
            socket = new WebSocket(wsUrl);
            
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "init" || data.type === "update") {
                    finalSpan.innerText = data.final;
                    nonfinalSpan.innerText = data.nonfinal || "";
                    scrollToBottom();
                } else if (data.type === "clear") {
                    finalSpan.innerText = "";
                    nonfinalSpan.innerText = "";
                }
            };
            
            socket.onclose = () => {
                console.log("Captions WebSocket closed. Retrying in 2 seconds...");
                setTimeout(connectWebSocket, 2000);
            };
            
            socket.onerror = (err) => {
                console.error("Captions WebSocket error:", err);
            };
        }
        
        connectWebSocket();
    </script>
</body>
</html>
